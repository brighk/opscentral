<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
  h1 { color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 10px; }
  h2 { color: #1e40af; margin-top: 30px; }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
  th { background-color: #2563eb; color: white; }
  tr:nth-child(even) { background-color: #f8fafc; }
  .header { text-align: center; margin-bottom: 40px; }
  .footer { margin-top: 40px; text-align: center; color: #999; font-size: 12px; }
  .score { font-size: 48px; font-weight: bold; color: #2563eb; text-align: center; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; color: white; }
  .badge-critical { background-color: #dc2626; }
  .badge-high { background-color: #ea580c; }
  .badge-medium { background-color: #ca8a04; }
  .badge-low { background-color: #16a34a; }
</style>
</head>
<body>
  <div class="header">
    <h1>{{ title }}</h1>
    <p>Generated: {{ generated_at }}</p>
  </div>
  {% block content %}{% endblock %}
  <div class="footer">
    <p>OpsCentral - IT Operations Platform</p>
  </div>
</body>
</html>
