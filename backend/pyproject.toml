[project]
name = "opscentral-backend"
version = "0.1.0"
description = "OpsCentral - IT Operations Platform for SMBs"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "emails>=0.6",
    "websockets>=14.0",
    "slowapi>=0.1.9",
    "stripe>=11.0",
    "weasyprint>=62.0",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "aiosqlite>=0.20",
    "celery-types>=0.26.0",
    "respx>=0.23.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query()/Header() defaults are the framework idiom
"app/**/*.py" = ["B008"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
