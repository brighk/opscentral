[project]
name = "opscentral-agent"
version = "0.1.0"
description = "OpsCentral lightweight monitoring agent"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "psutil>=6.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "schedule>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "types-pyyaml>=6.0",
    "types-psutil>=6.1",
]

[project.scripts]
opscentral-agent = "opscentral_agent.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend = "../ruff.toml"

[tool.pyright]
include = ["opscentral_agent"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
