[project]
name = "opscentral-agent"
version = "0.1.0"
description = "OpsCentral lightweight monitoring agent"
requires-python = ">=3.10"
dependencies = [
    "psutil>=6.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
opscentral-agent = "opscentral_agent.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
